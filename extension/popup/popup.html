<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>JustMyFeed</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1>JustMyFeed</h1>
  </header>

  <label class="toggle">
    <strong id="status">On</strong>
    <input type="checkbox" id="enabled" role="switch" checked>
    <span class="switch" aria-hidden="true"></span>
  </label>

  <button type="button" class="link" id="options">Settings</button>

  <script src="popup.js"></script>
</body>
</html>
