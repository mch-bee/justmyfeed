<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · JustMyFeed</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <img src="../icons/icon48.png" alt="" width="32" height="32">
      <h1>JustMyFeed settings</h1>
    </header>

    <section>
      <h2>Cover image</h2>
      <p class="muted">The cover is plain black. You can put an image of your own on it instead.</p>
      <div class="image-row">
        <div class="preview" id="preview">
          <span id="preview-empty">Plain black</span>
          <img id="preview-img" alt="" hidden>
        </div>
        <div class="image-actions">
          <label class="btn primary">Choose image…<input type="file" id="file" accept="image/*" hidden></label>
          <button type="button" class="btn" id="remove" hidden>Back to plain black</button>
          <p class="muted small">Tiled across the cover without distortion. Scaled down to 400 pixels. Stays on this computer only.</p>
        </div>
      </div>
    </section>

    <p class="saved" id="saved" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
